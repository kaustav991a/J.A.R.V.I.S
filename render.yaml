# Render Blueprint for the J.A.R.V.I.S. Cloud Gateway (always-on Telegram brain).
# Must live at the REPO ROOT so Render's Blueprint auto-detects it.
# Deploy: push to GitHub → Render → New → Blueprint → pick this repo.
# Secrets (sync:false) are NOT committed — set them in the Render dashboard.
services:
  - type: web
    name: jarvis-cloud-gateway
    runtime: python
    plan: free
    # Build/run from the backend folder that holds cloud_gateway.py.
    rootDir: jarvis-backend
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn cloud_gateway:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CLOUD_GATEWAY_MODE
        value: webhook
      # `llama-3.3-70b-versatile` was decommissioned by Groq on 2026-08-16. The
      # code default moved in a943582; this declared value did not, and a value
      # set here WINS over the code default — so the gateway's Groq leg would
      # have started 404ing on the 16th while every harness stayed green.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # The vision leg, and it was 404ing for five days without anything saying so.
      #
      # `meta-llama/llama-4-scout-17b-16e-instruct` — still the code default in
      # cloud_gateway.py, deliberately — was retired by Groq and answers
      # `404 model_not_found`. With Gemini's vision quota also exhausted
      # (`/health` read `vision.gemini_ok: 0`, `last_error_was_quota: true`),
      # BOTH legs were dead and every photo failed.
      #
      # `qwen/qwen3.6-27b` checked 2026-08-18: the only vision-capable model Groq
      # still serves, production rather than preview, and it takes the base64 data
      # URI `see()` already builds.
      #
      # Declared HERE and not only in the dashboard. A dashboard-only value is
      # dropped the next time this Blueprint is re-synced, silently, and the
      # symptom is photos failing again weeks later with nothing in the diff to
      # explain it.
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      # Which brain answers what. `groq` everywhere is the configuration that has
      # been in production; set any of these to `gemini` to switch that capability
      # alone. A switch needs no deploy, and every Gemini failure falls back to
      # Groq — check /health "brains" to see what is actually live.
      #   LLM_PROVIDER          default for all three
      #   LLM_PROVIDER_TEXT     chat and reasoning
      #   LLM_PROVIDER_VISION   photos
      #   LLM_PROVIDER_AUDIO    voice transcription
      - key: LLM_PROVIDER
        value: groq
      # TEXT is Gemini (2026-08-15, Kaustav's call): it answers code-switched
      # romanised Bengali/English markedly better than llama-3.3-70b, which is the
      # register this brain is actually spoken to in. Groq stays the default for
      # anything not named here, and every Gemini failure still falls back to Groq
      # loudly — check /health "brains.usage.text" for which one is really serving.
      - key: LLM_PROVIDER_TEXT
        value: gemini
      # Gemini is inert until a key is set, whatever the switches say.
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # Persistent rolling memory. Unset, the gateway remembers only within one
      # process life — and on the free tier a redeploy, a crash or a platform move
      # ends that, which is why it "keeps forgetting". Any free Postgres works
      # (Neon, Supabase); Render's own disk is ephemeral so SQLite is not an option.
      # The table is created on first use. Check /health "memory".
      - key: DATABASE_URL
        sync: false
      # Messages of history put into each prompt (turns x2). Twelve was chosen when
      # memory died with the process; with DATABASE_URL set, 40-60 is reasonable.
      # It costs tokens per call, so it is a budget, not a maximum.
      - key: CLOUD_MAX_TURNS
        value: "12"
      - key: CLOUD_WEB_LOOKUP
        value: "1"
      # PUBLIC_URL must equal this service's own https URL once Render assigns it,
      # e.g. https://jarvis-cloud-gateway.onrender.com  (set after first deploy).
      - key: PUBLIC_URL
        sync: false
      # The phone's pairing token for WS /app-link. Defaults to BRIDGE_SECRET when
      # unset; set it to give phones a credential you can rotate without dropping
      # the desk link. With BOTH unset, /app-link refuses every connection and
      # /health reports "app_link": false — which is what the app reads before it
      # will fall back to the cloud.
      - key: APP_TOKEN
        sync: false
      # The secret being REPLACED, during a rotation and never otherwise. Set it
      # to the outgoing value, deploy, move the desk's .env whenever that machine
      # is next on, then delete this. Both are accepted meanwhile, so neither end
      # can lock the other out - which is the ordering problem that kept a known-
      # leaked BRIDGE_SECRET live for weeks. /health.bridge_rotation counts every
      # connect still arriving on the old one, so this can be removed on evidence.
      - key: BRIDGE_SECRET_OLD
        sync: false
      # How long a CAPABILITY token minted from APP_TOKEN stays valid. The master
      # above still opens every route - his installed app presents it - but the
      # phone exchanges it at /app-tokens for one short-lived token per door, so
      # a leaked push credential buys the push route and nothing else, and only
      # until this many days are up. Declared here rather than left to the
      # dashboard on purpose: an undeclared variable is one the Blueprint cannot
      # be read for, which is exactly how LLM_PROVIDER_VISION came to say one
      # thing here and another in the live service (F-68).
      - key: APP_TOKEN_TTL_DAYS
        value: "30"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_USER_ID
        sync: false
      - key: TELEGRAM_GF_ID
        sync: false
      - key: TELEGRAM_BROTHER_ID
        sync: false
      - key: GROQ_API_KEYS
        sync: false
